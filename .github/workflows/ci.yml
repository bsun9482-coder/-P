name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # 单个用例挂死时快速失败，不要占满 GitHub 默认的 360 分钟上限。
    # （曾因 ASR 用例在无 DASHSCOPE_API_KEY 的 CI 环境下无限等待，
    #   job 挂满 6 小时才被强制取消）
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        env:
          DISABLE_SCHEDULER: "1"
        run: python -m pytest

  # 前端此前完全裸奔：没有 lint、没有格式检查、CI 也不构建。
  # 改了 Vue 组件写错模板/引错文件，后端测试全绿也发现不了 —— 这个 job 就是补那一刀。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 含未定义变量、拼错的全局名、Vue 模板结构性错误
      - name: ESLint
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      # 真正兜底的一步：模板编译不了、import 解析不到，这里会硬失败
      - name: Build
        run: npm run build
