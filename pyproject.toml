[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-coach-xiaop"
version = "0.1.0"
description = "基于 DeepSeek 的 Python/后端面试模拟与辅导 Agent（面试官小P）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "dashscope==1.27.2",
    "lxml==6.1.2",
    "apscheduler>=3.10,<4",
    "openai==3.6.0",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn==0.52.4",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
xiaop-voice = "app.main:main"
xiaop-crawl = "app.crawler.run:main"

[tool.setuptools.packages.find]
# 自动收集 app 及其子包，避免新增子包时漏登记（漏登记只会让装出来的包缺文件，极难查）。
# namespaces = false：只认带 __init__.py 的真包，不把纯数据目录（app/ui/assets）当命名空间包。
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
# 头像不是 .py，自动收集带不上，必须显式声明（app/ui/assets 是运行时 /assets 的挂载源）
app = ["ui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]
exclude = ["data", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# 中文内容/CSS/SVG 字符串多为长行，硬拆行反而伤可读性，统一忽略行宽检查
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
